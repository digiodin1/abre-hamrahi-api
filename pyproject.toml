[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "abr-hamrahi-api"
version = "0.1.0"
description = "Abr Hamrahi API: local versioned backup panel for Abrehamrahi (experimental unofficial API)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Abr Hamrahi API contributors"}]
keywords = ["backup", "abrehamrahi", "windows", "persian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
]

[project.scripts]
abr-hamrahi-api = "hamrahi_backup.cli:main"
hamrahi-backup = "hamrahi_backup.cli:main"

[project.urls]
Repository = "https://github.com/digiodin1/abre-hamrahi-api"
Issues = "https://github.com/digiodin1/abre-hamrahi-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hamrahi_backup = ["web/*.html", "web/*.css", "web/*.js"]
