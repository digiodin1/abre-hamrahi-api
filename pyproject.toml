[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "abre-hamrahi-api"
version = "1.1.0"
description = "Abre Hamrahi API: local versioned backup panel for Abrehamrahi"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Abre Hamrahi API contributors"}]
dependencies = []
keywords = ["backup", "abrehamrahi", "windows", "persian"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
]

[project.scripts]
abre-hamrahi-api = "hamrahi_backup.cli:main"
abr-hamrahi-api = "hamrahi_backup.cli:main"
hamrahi-backup = "hamrahi_backup.cli:main"

[project.optional-dependencies]
native = ["watchdog>=4,<8"]

[project.urls]
Repository = "https://github.com/digiodin1/abre-hamrahi-api"
Issues = "https://github.com/digiodin1/abre-hamrahi-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hamrahi_backup = ["web/*.html", "web/*.css", "web/*.js"]
